[gzrpn_modes]
heading = Проверка функции ЛО ГЗ РПН
intro_text = Для проверки функции ЛО ГЗ РПН предусматривается 12 режимов. Перечень подаваемых воздействий для каждого режима приводится в таблице XXX. Задаваемые уставки функций, необходимых для проверок, для каждого из режимов приведены в таблицах п.ХХХ – п.ХХХ. Функции, не участвующие в данных проверках, необходимо вывести из работы.
needed_inputs = gzrpn_needed_inputs.json
needed_outputs = gzrpn_needed_outputs.json
result_heading = Результат проверки функции ЛО ГЗ РПН
result_text = Проверка производится в соответствии с пунктом ХХХ данной программы. При проверке контролируется прохождение сигналов (на выходных реле – таблица ХХХ, в журнале текущих событий и осциллограмме) в соответствии с таблицей ХХХ. При этом по журналу событий контролируется появление ложных сигналов ФСУ при проведении данных опытов.
setting_heading = Параметры для проверки функции ЛО ГЗ РПН

