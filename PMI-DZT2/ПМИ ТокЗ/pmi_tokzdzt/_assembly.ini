[settings_general]
fbs = ['TOVCTOC', 'LVARCTOC', 'LTCBLKTOC', 'STRTPALC', 'TPALC', 'EQPALC', 'TPRMOFFLVLGC']

[tkzdz_modes]
heading = Проверка функции ТК ЗДЗ
intro_text = Для проверки функции ТК ЗДЗ предусматривается 7 режимов. Перечень подаваемых воздействий для каждого режима приводится в таблице XXX. Задаваемые уставки функций, необходимых для проверок, для каждого из режимов приведены в таблицах п.ХХХ – п.ХХХ. Функции, не участвующие в данных проверках, необходимо вывести из работы.
needed_inputs = tkzdz_needed_inputs.json
needed_outputs = tkzdz_needed_outputs.json
result_heading = Результат проверки функции ТК ЗДЗ
result_text = Проверка производится в соответствии с пунктом ХХХ данной программы. При проверке контролируется прохождение сигналов (на выходных реле – таблица ХХХ, в журнале текущих событий и осциллограмме) в соответствии с таблицей ХХХ. При этом по журналу событий контролируется появление ложных сигналов ФСУ при проведении данных опытов.
setting_heading = Параметры для проверки функции ТК ЗДЗ

