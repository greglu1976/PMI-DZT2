[settings_general]
fbs = ['DZT2_TPBRF', 'TPRMOFFLVLGC', 'HVTCBOFF', 'LVTPRMCBOFF1', 'LVTPRMCBOFF2', 'DZT2_SignAssembly', 'DZT2_LVALH']

[urov_modes]
heading = Проверка функции УРОВ
intro_text = Для проверки функции УРОВ предусматривается 21 режим. Перечень подаваемых воздействий для каждого режима приводится в таблице XXX. Задаваемые уставки функций, необходимых для проверок, для каждого из режимов приведены в таблицах п.ХХХ – п.ХХХ. Функции, не участвующие в данных проверках, необходимо вывести из работы.
needed_inputs = urov_needed_inputs.json
needed_outputs = urov_needed_outputs.json
result_heading = Результат проверки функции УРОВ
result_text = Проверка производится в соответствии с пунктом ХХХ данной программы. При проверке контролируется прохождение сигналов (на выходных реле – таблица ХХХ, в журнале текущих событий и осциллограмме) в соответствии с таблицей ХХХ. При этом по журналу событий контролируется появление ложных сигналов ФСУ при проведении данных опытов.
setting_heading = Параметры для проверки функции УРОВ

